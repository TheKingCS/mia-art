<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="application-name" content="MIA">
<meta name="description" content="MIA on Meta Ray-Ban Display glasses">
<meta name="mrbd-web-app-capable" content="yes">
<title>MIA</title>
<style>
  :root { --accent: #35d4ff; --soft: #a6ecff; --deep: #0b86ad; }
  html, body { height: 100%; }
  body { margin: 0; background: #000; color: #dff6ff; font: 22px/1.3 system-ui, sans-serif; display: grid; grid-template-rows: 1fr auto; overflow: hidden; }
  main { display: grid; place-items: center; min-height: 0; }
  #wrap { position: relative; width: 300px; height: 300px; transform: scale(.72); }
  #orb { position: absolute; inset: 60px; border-radius: 50%;
    background: radial-gradient(circle at 38% 30%, #fff 0%, var(--soft) 16%, var(--accent) 46%, var(--deep) 80%, #010507 100%);
    box-shadow: 0 0 60px rgba(53,212,255,.7), 0 0 150px rgba(53,212,255,.3), inset 0 0 26px rgba(220,248,255,.65);
    animation: breathe 5s ease-in-out infinite; }
  .ring { position: absolute; border-radius: 50%; border: 3px solid transparent; }
  .r1 { inset: 30px; border-top-color: #dff6ff; border-right-color: rgba(220,248,255,.35); animation: turn 9s linear infinite; }
  .r2 { inset: 12px; border-bottom-color: rgba(53,212,255,.9); border-left-color: rgba(53,212,255,.3); animation: turn 14s linear infinite reverse; }
  body.listening #orb { animation: listen 1.1s ease-in-out infinite; }
  body.thinking .r1, body.thinking .r2 { animation-duration: 1.4s; }
  body.speaking #orb { animation: speak .6s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: scale(1.06); filter: brightness(1.15); } }
  @keyframes listen { 50% { transform: scale(1.14); } }
  @keyframes speak { 25% { transform: scale(1.1); } 60% { transform: scale(.97); } }
  @keyframes turn { to { transform: rotate(360deg); } }
  footer { padding: 0 24px 24px; display: grid; gap: 8px; }
  #facts { text-align: center; color: var(--soft); font-size: 18px; min-height: 24px; }
  nav { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  button { font: inherit; color: #dff6ff; background: transparent; border: 2px solid rgba(53,212,255,.45); border-radius: 12px; padding: 8px 14px; }
  button:focus { outline: 3px solid var(--accent); }
  nav[hidden], button[hidden] { display: none; }
  #big { text-align: center; font-size: 48px; letter-spacing: 6px; color: var(--soft); }
</style>
</head>
<body>
<main><div id="wrap"><div class="ring r1"></div><div class="ring r2"></div><div id="orb"></div></div></main>
<footer>
  <div id="big"></div>
  <div id="facts"></div>
  <nav id="sure" hidden>
    <button id="match">They Match</button>
    <button id="differ">They Don't</button>
  </nav>
  <nav><button id="restart" hidden>Pair Again</button></nav>
  <nav id="tests" hidden>
    <button id="listen" autofocus>Listen</button>
    <button id="ask">Ask</button>
    <button id="blocked">Blocked</button>
    <button id="replay">Replay</button>
    <button id="bent">Tamper</button>
    <button id="again">Pair Again</button>
  </nav>
</footer>
<script type="module">
  // Pairing and the sealed relay, with made-up data only (DEC-0062).
  import { RELAY, commitment, confirmation, confirmed, derive, fromBase64, isKey, isNonce, isPromise, newKeyPair, newNonce, sealer, toBase64 } from "./sealed.js";

  const $ = (id) => document.getElementById(id);
  const say = (text) => { $("facts").textContent = text; };
  const STORE = "mia.relay";
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(STORE)); } catch (e) { saved = null; }
  const remember = () => { try { localStorage.setItem(STORE, JSON.stringify(saved)); } catch (e) { say("couldn't save the key"); } };

  // Stopped pairing waits for the person: no fresh tries they can't see.
  function stopped(why) {
    $("big").textContent = "";
    $("sure").hidden = true;
    say(why);
    $("restart").hidden = false;
    $("restart").focus();
    $("restart").onclick = () => { $("restart").hidden = true; pair(); };
  }

  async function pair() {
    const code = String(crypto.getRandomValues(new Uint32Array(1))[0] % 1000000).padStart(6, "0");
    $("big").textContent = code;
    say("Enter this in MIA on your phone: Settings, Glasses");
    const { pair: keys, pub } = await newKeyPair();
    const nonce = newNonce();
    const socket = new WebSocket(`${RELAY}/pair-${code}?role=page`);
    let promised = null;
    let found = null;
    let agreed = false;  // the person here has seen both match
    let proof = null;  // the phone's, kept until then
    let over = false;
    const abandon = (why) => { over = true; socket.close(); stopped(why); };

    const finish = async () => {
      if (!agreed || !proof || saved || over) return;
      if (!await confirmed(found.confirmPhone, found.transcript, proof)) return abandon("Pairing stopped: the proof was wrong.");
      if (over) return;
      socket.send(JSON.stringify({ t: "ok", mac: await confirmation(found.confirmPage, found.transcript) }));
      saved = { room: found.room, send: toBase64(found.send), receive: toBase64(found.receive), highest: 0 };
      remember();
      over = true;
      setTimeout(() => socket.close(), 500);
      $("big").textContent = "";
      $("sure").hidden = true;
      connect();
    };

    $("match").onclick = () => { agreed = true; say("Now confirm on your phone"); $("sure").hidden = true; finish(); };
    $("differ").onclick = () => abandon("Pairing stopped.");

    socket.onmessage = async (event) => {
      let message;
      try { message = JSON.parse(event.data); } catch (e) { return abandon("Pairing stopped: a bad message."); }
      if (over) return;
      if (message.t === "commit") {
        if (!isPromise(message.c)) return abandon("Pairing stopped: a bad message.");
        if (promised) { if (message.c !== promised) abandon("Pairing stopped: the promise changed."); return; }
        promised = message.c;
        socket.send(JSON.stringify({ t: "hello", pub: toBase64(pub), nonce: toBase64(nonce) }));
      } else if (message.t === "reveal" && promised && !found) {
        let phonePub, phoneNonce;
        try { phonePub = fromBase64(message.pub); phoneNonce = fromBase64(message.nonce); } catch (e) { return abandon("Pairing stopped: a bad message."); }
        if (!isKey(phonePub) || !isNonce(phoneNonce)) return abandon("Pairing stopped: a bad message.");
        if (await commitment(phonePub, phoneNonce) !== promised) return abandon("Pairing stopped: the key wasn't the one promised.");
        found = await derive(keys.privateKey, phonePub, pub, phonePub, nonce, phoneNonce);
        if (over) return;
        $("big").textContent = found.check.slice(0, 4) + " " + found.check.slice(4);
        say("Does your phone show the same number?");
        $("sure").hidden = false;
        $("differ").focus();  // a stray tap must never agree
      } else if (message.t === "ok" && found && !proof) {
        proof = message.mac;
        finish();
      }
    };
    socket.onclose = () => {
      if (saved || over) return;
      if (promised) stopped("Pairing stopped: the connection dropped.");
      else setTimeout(pair, 2000);  // nobody has answered yet, so nothing was tried
    };
  }

  function connect() {
    const box = sealer(fromBase64(saved.send), fromBase64(saved.receive), saved.highest || 0);
    const socket = new WebSocket(`${RELAY}/${saved.room}?role=page`);
    let last = "";
    const asked = new Map();  // each sealed answer must match a question, once
    let waiting = null;
    const send = (frame) => { last = frame; socket.send(frame); };
    const newId = () => toBase64(crypto.getRandomValues(new Uint8Array(12)));
    const ask = async (path) => {
      const id = newId();
      asked.set(id, path);
      send(await box.seal({ id, path }));
      expectReply();
    };
    const expectReply = () => {
      clearTimeout(waiting);
      waiting = setTimeout(() => say("no answer: the phone refused it"), 3000);
    };
    socket.onopen = () => { $("tests").hidden = false; $("listen").focus(); say("connected"); };
    socket.onmessage = async (event) => {
      try {
        const reply = await box.open(event.data);
        saved.highest = box.state.highest;
        remember();
        if (!asked.delete(reply.id)) return say("refused an answer nobody asked for");
        clearTimeout(waiting);
        say(reply.status === 200 ? reply.body.hello || "listening" : `refused by the phone (${reply.status})`);
      } catch (e) { say("refused a message from the relay"); }
    };
    socket.onclose = () => { $("tests").hidden = true; say("reconnecting"); setTimeout(connect, 3000); };
    $("again").onclick = () => { try { localStorage.removeItem(STORE); } catch (e) {} location.reload(); };
    $("listen").onclick = () => {
      document.body.className = "listening";
      setTimeout(() => { document.body.className = ""; }, 6000);
      ask("/voice/listen");
    };
    $("ask").onclick = () => ask("/test/hello");
    $("blocked").onclick = () => ask("/api/state");
    $("replay").onclick = () => { if (last) { say("sent the last message again"); socket.send(last); expectReply(); } };
    $("bent").onclick = async () => {
      const bytes = fromBase64(await box.seal({ id: newId(), path: "/test/hello" }));
      bytes[20] ^= 1;
      say("sent a changed message");
      socket.send(toBase64(bytes));
      expectReply();
    };
  }

  if (saved) connect(); else pair();
</script>
</body>
</html>
